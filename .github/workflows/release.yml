name: Publish release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS Apple Silicon release
    runs-on: macos-14

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify release version
        shell: bash
        run: |
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          main_commit="$(git rev-parse origin/main)"
          cli_version="$(cargo pkgid --package epub-cli | sed 's/.*#//')"
          core_version="$(cargo pkgid --package epub-core | sed 's/.*#//')"

          test "$tag_commit" = "$main_commit"
          test "$cli_version" = "$core_version"
          test "$cli_version" = "$GITHUB_REF_NAME"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build release binary
        run: cargo build --locked --release --package epub-cli

      - name: Package release assets
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          file target/release/manga2epub | grep -q "arm64"

          package_name="manga2epub-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          package_directory="dist/${package_name}"
          mkdir -p "${package_directory}/docs"
          cp target/release/manga2epub "$package_directory/"
          cp LICENSE LICENSE-APACHE LICENSE-MIT README.md "$package_directory/"
          cp docs/CLI_USAGE.md "$package_directory/docs/"

          tar -C dist -czf "dist/${package_name}.tar.gz" "$package_name"
          (
            cd dist
            shasum -a 256 "${package_name}.tar.gz" > SHA256SUMS.txt
          )

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*.tar.gz dist/SHA256SUMS.txt
          else
            release_options=(
              --title "$GITHUB_REF_NAME"
              --generate-notes
            )
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_options+=(--prerelease)
            fi

            gh release create "$GITHUB_REF_NAME" \
              "${release_options[@]}" \
              dist/*.tar.gz \
              dist/SHA256SUMS.txt
          fi
