[package]
name = "epub-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "epub_core"

[dependencies]
quick-xml = "0.39"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "7", default-features = false, features = ["deflate"] }

[dev-dependencies]
sha2 = "0.10"
